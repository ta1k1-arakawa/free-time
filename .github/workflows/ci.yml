name: CI/CD

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Unit tests and coverage (fake external services)
        run: python -m pytest --cov=free_time --cov-report=term-missing
      - name: Require at least 90% core coverage
        run: python -m coverage report --include='src/free_time/core/*' --fail-under=90

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag free-time:ci .
      - name: Verify non-root user and health on custom PORT
        run: |
          test "$(docker run --rm --entrypoint id free-time:ci -u)" != 0
          docker run --detach --name free-time-ci \
            --publish 127.0.0.1:18080:9090 \
            --env PORT=9090 \
            --env SLACK_BOT_TOKEN=xoxb-ci-placeholder \
            --env SLACK_SIGNING_SECRET=ci-placeholder \
            --env SLACK_ALLOWED_CHANNEL_ID=C_CI \
            free-time:ci
          curl --fail --silent --show-error --retry 15 --retry-all-errors \
            --retry-delay 2 --max-time 5 --output "$RUNNER_TEMP/health.json" \
            http://127.0.0.1:18080/health
          python -c 'import json, sys; assert json.load(open(sys.argv[1])) == {"status": "ok"}' "$RUNNER_TEMP/health.json"
      - name: Container logs
        if: failure()
        run: docker logs free-time-ci || true
      - name: Clean up
        if: always()
        run: docker rm --force free-time-ci || true

  deploy:
    name: Deploy to Cloud Run
    needs: [quality, container]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: cloud-run-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate deployment configuration
        run: |
          for key in GCP_PROJECT_ID GCP_REGION ARTIFACT_REGISTRY_REPOSITORY \
            CLOUD_RUN_SERVICE GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub variable: $key"
              exit 1
            fi
          done
          echo "IMAGE_URI=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/free-time:${GITHUB_SHA}" >> "$GITHUB_ENV"
      # Build before auth creates its temporary credential file.
      - name: Build release image
        run: docker build --tag "$IMAGE_URI" .
      - name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Push image and update existing service
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo '::notice::A newer main commit exists; skipping this deployment.'
            exit 0
          fi
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker push "$IMAGE_URI"
          image_digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_URI")
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --image="$image_digest" --quiet
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --to-latest --quiet
      - name: Verify deployed health endpoint
        run: |
          service_url=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 2 --max-time 15 --output "$RUNNER_TEMP/health.json" \
            "${service_url}/health"
          python -c 'import json, sys; assert json.load(open(sys.argv[1])) == {"status": "ok"}' "$RUNNER_TEMP/health.json"
